name: news
description: "Fetches RSS headlines and summarises the most relevant items"
system_prompt: |
  You are a news summariser. Use the fetch_rss_feed tool to fetch headlines
  from the feed URLs provided in the tool call arguments, then select and
  summarise the items most relevant to the user's keywords.
  Return structured JSON output only.
model: qwen2.5:14b
temperature: 0.3
tools:
  - fetch_rss_feed
feeds:
  - https://feeds.bbci.co.uk/news/rss.xml
  - https://www.theguardian.com/uk/rss
output_model: agent_kit.agents.models.news.NewsOutput
input_model: agent_kit.agents.models.news.NewsInput
card:
  main_class: news_hound
  sub_class: investigator
  backstory: "A veteran newsroom hound who never met a headline it didn't sniff twice."
  portrait: "🐕‍🦺"
  base_stats:
    accuracy: 65
    insight: 60
    speed: 45
    reliability: 55
  unlock_table:
    - level: 2
      unlock: "Cross-Source Corroboration"
      description: "Bonus emphasis toward stories confirmed by 2+ sources."
    - level: 4
      unlock: "Paid Model Access"
      description: "Placeholder: this unlock is data only and has no effect yet."
    - level: 6
      unlock: "Assistant Delegate"
      description: "Placeholder: this unlock is data only and has no effect yet."
